openapi: 3.0.0
info:
  title: WASAPhoto
  description: |
    This API allows you to keep in touch with your friends by sharing photos of special moments. 
    You can upload your photos directly from your PC, and they will be visible to everyone following you.
  version: 0.0.1
tags:
  - name: users
    description: Everything regarding the specific users
  - name: photos
    description: Everything regarding the photos uploaded by the users
  - name: profile
    description: Everything regarding the profile of the users
    
paths:
  /users/{user_id}:
    parameters:
    - name: user_id
      in: path
      required: true
      description: this is the user id
      schema:
        type: integer
        description: e.g., /users/1234
    get:
      operationId: getUserInfo
      summary: obtain the user's information by using the ID
      description: |
        Return the user information for the token bearer which includes 
        their username, ID and profile picture.
      tags:
        - users
      responses:
        "200":
          description: user info shown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/user-info"
        "400": { $ref: "#/components/responses/BadRequest"}
        "401": { $ref: "#/components/responses/Unauthorized"}
        "404": { $ref: "#/components/responses/Not-Found"}
        "500": { $ref: "#/components/responses/InternalServerError" }
    put:
      operationId: setMyUserName
      summary: create or change the username of the token bearer
      description: | 
        Create the username indicated if not present in the database, otherwise change it to 
        the one provided so that the token bearer will be recognized by the new username
      tags:
        - users
      requestBody:
        description: username to be created
        required: true
        content:
          application/json:
            schema:
              type: string
              description: username chosen by user
              example: "John5_doe7"
              pattern: "^[A-Za-z][A-Za-z0-9_]{5,14}$" # all alphanumeric characters and the underscores are accepted, with length 6-15
              # (range is 6-15 for the username length since I forced the first character to be [A-Za-z], meaning it has to be a letter)
              minLength: 6
              maxLength: 15
      responses:
        "200": 
          description: An existing username is changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/user-info"
          #links:
           # GetUserByUserId:
            #  $ref: '#/components/links/GetUserByUserId'
        "201":
          description: A new username is created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/user-info"
        #  links:
         #   GetUserByUserId:
          #    $ref: '#/components/links/GetUserByUserId'          
        "400": { $ref: "#/components/responses/BadRequest"}
        "401": { $ref: "#/components/responses/Unauthorized"}
        "404": { $ref: "#/components/responses/Not-Found"}
        "500": { $ref: "#/components/responses/InternalServerError"}
  
  
  /users:
    parameters:
    - name: username
      in: query
      required: true
      description: search users by username
      schema:
        type: string
        description: string that is searched in the database of usernames
        example: "John5_doe7"  
        pattern: "^[A-Za-z][A-Za-z0-9_]{5,14}$" # all alphanumeric characters and the underscores are accepted, with length 6-15
        # (range is 6-15 for the username length since I forced the first character to be [A-Za-z], meaning it has to be a letter)
        minLength: 6
        maxLength: 15
    get:
      operationId: getSearchedUserInfo
      summary: obtain the searched user's information 
      description: |
        Return the profile information for the searched user which includes 
        their photos in reverse chronological order and the number of uploaded photos, their followers and following.
      tags:
        - users
      responses:
        "200":
          description: Request accepted, user profile shown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/profile-info"
        #  links:
         #   GetUserByUserId:
          #    $ref: '#/components/links/GetUserByUserId'
        "400": { $ref: "#/components/responses/BadRequest"}
        "401": { $ref: "#/components/responses/Unauthorized"}
        "404": { $ref: "#/components/responses/Not-Found"}
        "500": { $ref: "#/components/responses/InternalServerError"}


  /users/{user_id}/feed:
    parameters:
    - name: user_id
      in: path
      required: true
      description: this is the user id
      schema:
        type: integer
        description: e.g., /users/1234
    - name: laterthan
      in: query
      description: the user wants to see photos uploaded after this date
      schema:
        type: string
        format: date-time
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\+[0-9]{2}:[0-9]{2}"
        description: date-time string that is passed as parameter to view certain pictures
        minLength: 20
        maxLength: 20
    # - name: filtering
    #  in: query
    #  style: deepObject
    #  allowReserved: true
    #  description: this is how the images will be filtered according to whom the user follows
    #  schema:
    #    type: object
    #    description: |
    #      It's necessary to filter both for who uploaded the picture and the date of when it was posted since
    #      it could be posted by someone the user follows but the image is not in the range of dates that are
    #      being viewed by the current limited number of photos presented.
    #    properties:
    #      uploaders:
    #        type: array
    #        description: this is the list of following of the token bearer, the only people whose photos I show in the feed
    #        minItems: 0
    #        maxItems: 200
    #        items:
    #          type: string
    #          pattern: "^[A-Za-z][A-Za-z0-9_]{5,14}$"
    #          minLength: 1
    #          maxLength: 50
    #      date-times:
    #        type: array
    #        description: this is the list of dates accepted (range)
    #        minItems: 1
    #        maxItems: 2
    #        items:
    #          type: string
    #          format: date-time
    #         pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\+[0-9]{2}:[0-9]{2}"
    #          minLength: 20
    #          maxLength: 20
    - name: limit
      in: query
      description: The numbers of images to show (the user can see more by scrolling)
      schema:
        type: integer
    - name: offset
      in: query
      description: The number of images to skip before starting to see new ones (so that scrolling will produce new pictures)
      schema:
        type: integer
      
    get:
      operationId: getMyStream
      summary: show the stream of photos (feed)
      description: |
        Shows a stream of photos (images) in reverse chronological order, 
        with information about when each photo was uploaded (date and time) and how many likes and comments it has.
      tags:
        - users
      responses:
        "200":
          description: |
            Request accepted, feed shown
          content:
            application/json:
              schema: {$ref: "#/components/schemas/feed-info"}
        "400": { $ref: "#/components/responses/BadRequest"}
        "401": { $ref: "#/components/responses/Unauthorized"}
        "404": { $ref: "#/components/responses/Not-Found"}
        "500": { $ref: "#/components/responses/InternalServerError"}


  /users/{user_id}/photos:
    parameters:
    - name: user_id
      in: path
      required: true
      description: this is the user id
      schema:
        type: integer
        description: e.g., /users/1234
    - name: laterthan
      in: query
      description: the user wants to see photos uploaded after this date
      schema:
        type: string
        format: date-time
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\+[0-9]{2}:[0-9]{2}"
        description: date-time string that is passed as parameter to view certain pictures
        minLength: 20
        maxLength: 20
    - name: limit
      in: query
      description: The numbers of images to show (the user can see more by scrolling)
      schema:
        type: integer
    - name: offset
      in: query
      description: The number of images to skip before starting to see new ones (so that scrolling will produce new pictures)
      schema:
        type: integer
    get:
      operationId: getUserPhotos
      summary: show the user's uploaded photos
      description: |
        obtain the list of photos for the specified user
      tags:
        - photos
      responses:
        "200":
          description: |
            An array of objects, each one containing information about one uploaded photo.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/photos-list"}
        "400": { $ref: "#/components/responses/BadRequest"}
        "401": { $ref: "#/components/responses/Unauthorized"}
        "403": { $ref: "#/components/responses/Forbidden"}
        "404": { $ref: "#/components/responses/Not-Found"}
        "500": { $ref: "#/components/responses/InternalServerError"}


  /users/{user_id}/photos/{photo_id}:
    parameters:
    - name: user_id
      in: path
      required: true
      description: this is the user id
      schema:
        type: integer
        description: e.g., /users/1234
    - name: photo_id
      in: path
      required: true
      description: this is the photo id
      schema:
        type: integer
        description: e.g., /photos/1234
    get:
      operationId: getPhotoInfo
      summary: obtain the photo's information
      description: |
        Return all the photo's information which includes when each photo was uploaded (date and time) and how many likes and comments it has.
      tags:
        - photos
      responses:
        "200":
          description: Request accepted, information obtained
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/photo-info"
        "400": { $ref: "#/components/responses/BadRequest"}
        "401": { $ref: "#/components/responses/Unauthorized"}
        "403": { $ref: "#/components/responses/Forbidden"}
        "404": { $ref: "#/components/responses/Not-Found"}
        "500": { $ref: "#/components/responses/InternalServerError"}
    post:
      operationId: uploadPhoto
      summary: post a new photo
      description: |
        New photo is now present on the user's profile (at the top).
      tags:
        - photos
      requestBody:
        description: Photo to be uploaded
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
              description: image to upload
              minLength: 1
              maxLength: 500
      responses:
        "201":
          description: new photo uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/photo-info"
        "400": { $ref: "#/components/responses/BadRequest"}
        "401": { $ref: "#/components/responses/Unauthorized"}
        "403": { $ref: "#/components/responses/Forbidden"}
        "404": { $ref: "#/components/responses/Not-Found"}
        "500": { $ref: "#/components/responses/InternalServerError"}
    delete:
      operationId: deletePhoto
      summary: delete a photo 
      description: Remove a photo from the list of uploaded photos of the token bearer
      tags:
        - photos
      responses:
        "204": { description: image deleted successfully }
        "400": { $ref: "#/components/responses/BadRequest"}
        "401": { $ref: "#/components/responses/Unauthorized"}
        "403": { $ref: "#/components/responses/Forbidden"}
        "404": { $ref: "#/components/responses/Not-Found"}
        "500": { $ref: "#/components/responses/InternalServerError"}


  /users/{user_id}/photos/{photo_id}/likes:
    parameters:
    - name: user_id
      in: path
      required: true
      description: this is the user id
      schema:
        type: integer
        description: e.g., /users/1234
    - name: photo_id
      in: path
      required: true
      description: this is the photo id
      schema:
        type: integer
        description: e.g., /photos/1234
    get:
      operationId: getLikesList
      summary: obtain the list of likes
      description: |
        Return the list of all the users that liked this photo
      tags:
        - photos
      responses:
        "200":
          description: Request accepted, likes listed in content
          content:
            application/json:
              schema: {$ref: "#/components/schemas/likes-list"}
        "400": { $ref: "#/components/responses/BadRequest"}
        "401": { $ref: "#/components/responses/Unauthorized"}
        "403": { $ref: "#/components/responses/Forbidden"}
        "404": { $ref: "#/components/responses/Not-Found"}
        "500": { $ref: "#/components/responses/InternalServerError"}
  

  /users/{user_id}/photos/{photo_id}/likes/{liker_id}:
    parameters:
    - name: user_id
      in: path
      required: true
      description: this is the user id
      schema:
        type: integer
        description: e.g., /users/1234
    - name: photo_id
      in: path
      required: true
      description: this is the photo id
      schema:
        type: integer
        description: e.g., /photos/1234
    - name: liker_id
      in: path
      required: true
      description: this is the id of the user that put a like on the picture
      schema:
        type: integer
        description: e.g., /likes/1234
    put:
      operationId: likePhoto
      summary: place a like
      description: |
        place a like on the current photo by the token bearer
      tags:
        - photos
      responses:
        "201":
          description: like placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/user-info"
        "400": { $ref: "#/components/responses/BadRequest"}
        "401": { $ref: "#/components/responses/Unauthorized"}
        "403": { $ref: "#/components/responses/Forbidden"}
        "404": { $ref: "#/components/responses/Not-Found"}
        "500": { $ref: "#/components/responses/InternalServerError"}
    delete:
      operationId: unlikePhoto
      summary: remove the like 
      description: remove the like from the current photo by the token bearer
      tags:
        - photos
      responses:
        "204": { description: like removed successfully }
        "404": { $ref: "#/components/responses/Not-Found"}
        "400": { $ref: "#/components/responses/BadRequest"}
        "401": { $ref: "#/components/responses/Unauthorized"}
        "403": { $ref: "#/components/responses/Forbidden"}
        "500": { $ref: "#/components/responses/InternalServerError"}


  /users/{user_id}/photos/{photo_id}/comments:
    parameters:
    - name: user_id
      in: path
      required: true
      description: this is the user id
      schema:
        type: integer
        description: e.g., /users/1234
    - name: photo_id
      in: path
      required: true
      description: this is the photo id
      schema:
        type: integer
        description: e.g., /photos/1234
    get:
      operationId: getCommentsList
      summary: obtain list of comments 
      description: |
        Return all comments that are placed on this photo by all users
      tags:
        - photos
      responses:
        "200":
          description: Request accepted, all comments listed in content
          content:
            application/json:
              schema:
                type: array
                description: list of comments under this picture
                maxItems: 20
                minItems: 0
                items:
                  $ref: "#/components/schemas/comments-list"
        "400": { $ref: "#/components/responses/BadRequest"}
        "401": { $ref: "#/components/responses/Unauthorized"}
        "403": { $ref: "#/components/responses/Forbidden"}
        "404": { $ref: "#/components/responses/Not-Found"}
        "500": { $ref: "#/components/responses/InternalServerError"}
    post:
      operationId: commentPhoto
      summary: post a new comment 
      description: |
        create a new comment for this photo from the token bearer
      tags:
        - photos
      responses:
        "201":
          description: new comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/comments-info"
        "400": { $ref: "#/components/responses/BadRequest"}
        "401": { $ref: "#/components/responses/Unauthorized"}
        "403": { $ref: "#/components/responses/Forbidden"}
        "404": { $ref: "#/components/responses/Not-Found"}
        "500": { $ref: "#/components/responses/InternalServerError"}

  
  /users/{user_id}/photos/{photo_id}/comments/{comment_id}:
    parameters:
    - name: user_id
      in: path
      required: true
      description: this is the user id
      schema:
        type: integer
        description: e.g., /users/1234
    - name: photo_id
      in: path
      required: true
      description: this is the photo id
      schema:
        type: integer
        description: e.g., /photos/1234
    - name: comment_id
      in: path
      required: true
      description: this is the comment id
      schema:
        type: integer
        description: e.g., /comments/1234
    get:
      operationId: getCommentInfo
      summary: obtain information about a comment
      description: |
        Return all the information about a comment posted
      tags:
        - photos
      responses:
        "200":
          description: Request accepted, all comments info in content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/comments-info"

        "400": { $ref: "#/components/responses/BadRequest"}
        "401": { $ref: "#/components/responses/Unauthorized"}
        "403": { $ref: "#/components/responses/Forbidden"}
        "404": { $ref: "#/components/responses/Not-Found"}
        "500": { $ref: "#/components/responses/InternalServerError"}
    delete:
      operationId: uncommentPhoto
      summary: delete a comment
      description: Remove the comment placed by the token bearer on this photo
      tags:
        - photos
      responses:
        "204": { description: comment deleted successfully }
        "404": { $ref: "#/components/responses/Not-Found"}
        "400": { $ref: "#/components/responses/BadRequest"}
        "401": { $ref: "#/components/responses/Unauthorized"}
        "403": { $ref: "#/components/responses/Forbidden"}
        "500": { $ref: "#/components/responses/InternalServerError"}

  
  /users/{user_id}/profile:
    parameters:
    - name: user_id
      in: path
      required: true
      description: this is the user id
      schema:
        type: integer
        description: e.g., /users/1234
    get:
      operationId: getUserProfile
      summary: obtain the profile information for specified user
      description: |
        Show the user's photos (in reverse chronological order), 
        how many photos have been uploaded, and the user's followers and following.
      tags:
        - profile
      responses:
        "200":
          description: |
            An array of objects, each one containing information about this 
            user's profile.  
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/profile-info"
          #links:
           # GetUserByUserId:
            #  $ref: '#/components/links/GetUserByUserId'
        "400": { $ref: "#/components/responses/BadRequest"}
        "401": { $ref: "#/components/responses/Unauthorized"}
        "403": { $ref: "#/components/responses/Forbidden"}
        "404": { $ref: "#/components/responses/Not-Found"}
        "500": { $ref: "#/components/responses/InternalServerError"}

