  /users/{user_id}/following/{following_id}:
    parameters:
    - name: user_id
      in: path
      required: true
      description: this is the user id
      schema:
        type: integer
        description: e.g., /users/1234
    - name: following_id
      in: path
      required: true
      description: this is the following user id
      schema:
        type: integer
        description: e.g., /following/1234
    put:
      operationId: followUser
      summary: follow a new user
      description: |
        the token bearer now follows the specified user 
      tags:
        - profile
      responses:
        "201":
          description: new following user added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/user-info"
         # links:
          #    GetUserByUserId:
           #     $ref: '#/components/links/GetUserByUserId'
        "400": { $ref: "#/components/responses/BadRequest"}
        "401": { $ref: "#/components/responses/Unauthorized"}
        "403": { $ref: "#/components/responses/Forbidden"}
        "404": { $ref: "#/components/responses/Not-Found"}
        "500": { $ref: "#/components/responses/InternalServerError"}
    get:
      operationId: getFollowing
      summary: list all followed users
      description: |
        Obtain the list of all followed users
      tags:
        - profile
      responses:
        "200":
          description: |
            list of followed users shown
          content:
            application/json:
              schema:
                type: array
                description: list of users followed
                maxItems: 500
                minItems: 0
                items:
                  $ref: "#/components/schemas/following-list"
          #links:
           # GetUserByUserId:
            #  $ref: '#/components/links/GetUserByUserId'
        "400": { $ref: "#/components/responses/BadRequest"}
        "401": { $ref: "#/components/responses/Unauthorized"}
        "403": { $ref: "#/components/responses/Forbidden"}
        "404": { $ref: "#/components/responses/Not-Found"}
        "500": { $ref: "#/components/responses/InternalServerError"}
    delete:
      operationId: unfollowUser
      summary: unfollow a user
      description: Remove the specified user from the following list of the token bearer
      tags:
        - profile
      responses:
        "204": { description: user removed from following list}
        "404": { $ref: "#/components/responses/Not-Found"}
         # links:
          #  GetUserByUserId:
           #   $ref: '#/components/links/GetUserByUserId'
        "400": { $ref: "#/components/responses/BadRequest"}
        "401": { $ref: "#/components/responses/Unauthorized"}
        "403": { $ref: "#/components/responses/Forbidden"}
        "500": { $ref: "#/components/responses/InternalServerError"}

  
  /users/{user_id}/followers/{follower_id}:
    parameters:
    - name: user_id
      in: path
      required: true
      description: this is the user id
      schema:
        type: integer
        description: e.g., /users/1234
    - name: follower_id
      in: path
      required: true
      description: this is the follower id
      schema:
        type: integer
        description: e.g., /followers/1234
    get:
      operationId: getFollowers
      summary: list all followers for the specified user
      description: |
        Obtain the list of all users that follow the token bearer
      tags:
        - profile
      responses:
        "200":
          description: |
            A list of followers of the token bearer
          content:
            application/json:
              schema:
                type: array
                description: list of users that follow the token bearer
                maxItems: 500
                minItems: 0
                items:
                  $ref: "#/components/schemas/followers-list"
         # links:
          #  GetUserByUserId:
           #   $ref: '#/components/links/GetUserByUserId'
        "400": { $ref: "#/components/responses/BadRequest"}
        "401": { $ref: "#/components/responses/Unauthorized"}
        "403": { $ref: "#/components/responses/Forbidden"}
        "404": { $ref: "#/components/responses/Not-Found"}
        "500": { $ref: "#/components/responses/InternalServerError"}
    delete:
      operationId: removeFollower
      summary: remove a user from followers list
      description: |
        Remove the specified user from the followers list of the token bearer, so that 
        that user is not following the token bearer anymore
      tags:
        - profile
      responses:
        "204": { description: user removed from followers list}
        "404": { $ref: "#/components/responses/Not-Found"}
          #links:
           # GetUserByUserId:
            #  $ref: '#/components/links/GetUserByUserId'
          
        "400": { $ref: "#/components/responses/BadRequest"}
        "401": { $ref: "#/components/responses/Unauthorized"}
        "403": { $ref: "#/components/responses/Forbidden"}
        "500": { $ref: "#/components/responses/InternalServerError"}


  /users/{user_id}/banned/{banned_id}:
    parameters:
    - name: user_id
      in: path
      required: true
      description: this is the user id
      schema:
        type: integer
        description: e.g., /users/1234
    - name: banned_id
      in: path
      required: true
      description: this is the banned user id
      schema:
        type: integer
        description: e.g., /banned/1234
    get:
      operationId: getBannedList
      summary: list all banned users
      description: |
        Obtain the list of all the users that were banned by the token bearer.
      tags:
        - users
      responses:
        "200":
          description: |
            An object containing all of the users banned by the token bearer
          content:
            application/json:
              schema:
                type: array
                description: list of banned users
                maxItems: 20
                minItems: 0
                items:
                  $ref: "#/components/schemas/banned-users"
          #links:
           # GetUserByUserId:
            #  $ref: '#/components/links/GetUserByUserId'
        "400": { $ref: "#/components/responses/BadRequest"}
        "401": { $ref: "#/components/responses/Unauthorized"}
        "403": { $ref: "#/components/responses/Forbidden"}
        "404": { $ref: "#/components/responses/Not-Found"}
        "500": { $ref: "#/components/responses/InternalServerError"}
    put:
      operationId: banUser
      summary: ban a new user
      description: |
        Ban the indicated user, so that they are not able to see anything on
        the token bearer's profile aside from the username.
      tags:
        - users
      responses:
        "201":
          description: banned a user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/user-info"
         # links:
          #  GetUserByUserId:
           #   $ref: '#/components/links/GetUserByUserId'          
        "400": { $ref: "#/components/responses/BadRequest"}
        "401": { $ref: "#/components/responses/Unauthorized"}
        "403": { $ref: "#/components/responses/Forbidden"}
        "404": { $ref: "#/components/responses/Not-Found"}
        "500": { $ref: "#/components/responses/InternalServerError"}
    delete:
      operationId: unbanUser
      summary: unban a user
      description: unban a previously-and-until-now-currently banned user
      tags:
        - users
      responses:
        "204": { description: user unbanned successfully}
        "404": { $ref: "#/components/responses/Not-Found"}
         # links:
          #  GetUserByUserId:
           #   $ref: '#/components/links/GetUserByUserId'
        "400": { $ref: "#/components/responses/BadRequest"}
        "401": { $ref: "#/components/responses/Unauthorized"}
        "403": { $ref: "#/components/responses/Forbidden"}
        "500": { $ref: "#/components/responses/InternalServerError"}

                  
  /session:
    post:
      tags: ["login"]
      summary: Logs in the user
      description: |-
        If the user does not exist, it will be created,
        and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      requestBody:
        description: User details
        content:
          application/json:
            schema:
              description: User details for the login
              type: object
              properties:
                name:
                  type: string
                  example: Maria
                  pattern: "^.*?$"
                  description: User details for the login
                  minLength: 3
                  maxLength: 16
        required: true
      responses:
        '201':
          description: User log-in action successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/login-info"
      "security": [] # login is not needed to perform the login

components:
  schemas:
    profile-info:
      type: object
      description: the information about the profile
      properties:
        username:
          type: string
          description: username of the user's profile
          example: "John5_doe7"
          pattern: "^[A-Za-z][A-Za-z0-9_]{5,14}$"
          minLength: 6
          maxLength: 15

        user-id:
          type: integer
          description: user id

        photos:
          type: array
          description: uploaded photos
          maxItems: 200
          minItems: 0
          items:
            $ref: "#/components/schemas/photo-info"

        num-photos:
          type: integer
          description: number of uploaded photos
        
        followers: {$ref: "#/components/schemas/followers-list"}
        
        following: {$ref: "#/components/schemas/following-list"}

    photo-info:
      type: object
      description: the information about the photo
      properties:
        photo-id:
          type: integer
          description: photo id
        
        photo-url:
          type: string
          description: URL of the picture
          pattern: '(www|http:|https:)+[^\s"]+[\w]'
          # first part checks that the URL starts with "http", "https" or "www"; the rest is just for allowing all characters in the 
          # URL, except whitespaces and quotation marks.
          minLength: 1
          maxLength: 100

        creator:
          type: integer
          description: user id of the poster of the photo

        date-time: 
          type: string
          format: date-time
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\+[0-9]{2}:[0-9]{2}"
          description: upload date and time of the photo
          # example: "2022-12-25T00:07:59+00:00"
          minLength: 20
          maxLength: 20

        num-likes:
          type: integer
          description: number of likes on the photo
        
        num-comments:
          type: integer
          description: number of comments on the photo

        # profile-pic:
        #  type: string
        #  description: URL of profile picture of this user
        #  pattern: '(www|http:|https:)+[^\s"]+[\w]'
        #  # first part checks that the URL starts with "http", "https" or "www"; the rest is just for allowing all characters in the 
        #  # URL, except whitespaces and quotation marks.
        #  minLength: 0
        #  maxLength: 100

    user-info:
      type: object
      description: the information about the user
      properties:
        user-id:
          type: integer
          description: user id

        username:
          type: string
          description: username of the user's profile
          example: "John5_doe7"
          pattern: "^[A-Za-z][A-Za-z0-9_]{5,14}$"
          minLength: 6
          maxLength: 15

    feed-info:
      type: object
      description: the feed object
      properties:
        photos:
          type: array
          description: photos from followed users
          maxItems: 150
          minItems: 0
          items:
            $ref: "#/components/schemas/photo-info"

    photos-list:
      type: object
      description: the photos of a user
      properties:
        photos:
          type: array
          description: uploaded photos from the specified user
          maxItems: 100
          minItems: 1
          items:
            $ref: "#/components/schemas/photo-info"

    likes-list:
      type: object
      description: the likes list for a photo
      properties:
        photo-id:
          type: integer
          description: id of the photo that's being liked

        likes:
          type: array
          description: users that liked this picture
          maxItems: 200
          minItems: 1
          items:
            $ref: "#/components/schemas/likes-info"

    likes-info:
      type: object
      description: the information of a like
      properties:
        like-id:
          type: integer
          description: id of the like

        liker:
          type: string
          description: username of the person that liked this picture
          pattern: "^[A-Za-z][A-Za-z0-9_]{5,14}$"
          minLength: 6
          maxLength: 15

    comments-list:
      type: object
      description: the comments list for a photo
      properties:
        photo-id:
          type: integer
          description: id of the photo that's being commented on

        comments:
          type: array
          description: comments posted on the picture and their info 
          maxItems: 20
          minItems: 1
          items:
            $ref: "#/components/schemas/comments-info"
    
    comments-info:
      type: object
      description: the information of a comment
      properties:
        comment-id:
          type: integer
          description: id of the comment that's being commented

        poster:
          type: string
          description: username of the person that commented this string on the picture
          pattern: "^[A-Za-z][A-Za-z0-9_]{5,14}$"
          minLength: 6
          maxLength: 15

        comment:
          type: string
          description: comment posted on the picture
          pattern: "^[a-zA-Z0-9 \\.,:;\n]*$" # all "normal" characters allowed, including line-feed
          minLength: 1
          maxLength: 500
        
        date-time: 
          type: string
          format: date-time
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\+[0-9]{2}:[0-9]{2}"
          description: date and time of when the comment was posted
          # example: "2022-12-25T00:07:59+00:00"
          minLength: 20
          maxLength: 20

    following-list:
      type: object
      description: the list of followings of a user
      properties:
        users:
          type: array
          description: users that the token bearer is following
          maxItems: 500
          minItems: 0
          items:
            $ref: "#/components/schemas/user-info"

    followers-list:
      type: object
      description: the list of followers of a user
      properties:
        users:
          type: array
          description: list of users that follow the token bearer
          maxItems: 500
          minItems: 0
          items:
            $ref: "#/components/schemas/user-info"
         
    banned-users:
      type: object
      description: the list of banned users of a user
      properties:
        users:
          type: array
          description: list of users the token bearer banned 
          maxItems: 20
          minItems: 0
          items:
            $ref: "#/components/schemas/user-info"
    
    login-info:
      type: object
      description: login successful
      properties:
        identifier:
          # change here if you decide to use an integer
          # or any other type of identifier
          type: string
          example: "abcdef012345"
          pattern: "^.*?$"
          description: identifier
          minLength: 3
          maxLength: 16
            

  #links:
   # GetUserByUserId:  
    #  operationId: getUserInfo
     # parameters:
      #  user-id: '$response.body#/user-id'
      #description: >
        #The user-id value returned in the response can be used as
        #the user-id parameter in `GET /users/{user_id}`


  responses:
    BadRequest:
      description: The request was not compliant with the documentation (e.g. missing fields, etc).
    
    Unauthorized:
      description: Authentication is required to complete this action. The access token is missing or invaliker_id. The user should log in.
    
    Forbidden:
      description: This action is not allowed (e.g. the token bearer was banned by the user they were trying to follow, etc).

    Not-Found:
      description: The resource could not be found.

    InternalServerError:
      description: The server encountered an internal error. Further info in server logs.

  securitySchemes:
    BearerAuthorization:         
      type: http
      scheme: bearer
      bearerFormat: JWT 
    
security: # Apply the security globally to all operations
  - BearerAuthorization: []      
