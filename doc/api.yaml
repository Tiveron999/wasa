openapi: 3.0.0
info:
  title: WASAPhoto
  description: |
    This API allows you to keep in touch with your friends by sharing photos of special moments. 
    You can upload your photos directly from your PC, and they will be visible to everyone following you.
  version: 0.0.1
tags:
  - name: users
    description: Everything regarding the specific users
  - name: photos
    description: Everything regarding the photos uploaded by the users
  - name: profile
    description: Everything regarding the profile of the users
    
paths:
  /users:
    put:
      operationId: setMyUserName
      summary: create or change the username of the token bearer
      description: | 
        Create the username indicated if not present in the database, otherwise change it to 
        the one provided so that the token bearer will be recognized by the new username
      tags:
        - users
      requestBody:
        description: username to be created
        required: true
        content:
          application/json:
            schema:
              type: string
              description: username chosen by user
              example: "John5_doe7"
              pattern: "^[A-Za-z][A-Za-z0-9_]{5,14}$" #range 6-15 for the username length since I forced the first character to be [A-Za-z]
      responses:
        "200": 
           description: An existing username is changed
        "201":
           description: A new username is created


  /users/{user-id}:
    parameters:
    - name: user-id
      in: path
      required: true
      description: this is the user id
      schema:
        type: integer
        description: e.g., /users/1234
    get:
      operationId: getUserInfo
      summary: obtain the user's information 
      description: |
        Return the user information for the token bearer which includes 
        their username and ID.
      tags:
        - users
      responses:
        "200":
          description: user info shown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/user-info"
  
  
  /users/search:
    parameters:
    - name: username
      in: query
      required: true
      description: search users by username
      schema:
        type: string
        description: string that is searched in the database of usernames
        example: "John5_doe7"
        pattern: "^[A-Za-z][A-Za-z0-9_]{5,14}$" #range 6-15 for the username length since I forced the first character to be [A-Za-z]
    get:
      operationId: getSearchedUserInfo
      summary: obtain the searched user's information 
      description: |
        Return the profile information for the searched user which includes 
        their photos in reverse chronological order and the number of uploaded photos, their followers and following.
      tags:
        - users
      responses:
        "200":
          description: Request accepted, user profile shown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/profile-info"


  /users/{user-id}/feed:
    parameters:
    - name: user-id
      in: path
      required: true
      description: this is the user id
      schema:
        type: integer
        description: e.g., /users/1234
    get:
      operationId: getMyStream
      summary: show the stream of photos (feed)
      description: |
        Shows a stream of photos (images) in reverse chronological order, 
        with information about when each photo was uploaded (date and time) and how many likes and comments it has.
      tags:
        - users
      responses:
        "200":
          description: |
            Request accepted, feed shown
          content:
            application/json:
              schema:
                type: array
                description: list of photos to present as the feed
                items:
                  $ref: "#/components/schemas/feed-info"


  /users/{user-id}/photos:
    parameters:
    - name: user-id
      in: path
      required: true
      description: this is the user id
      schema:
        type: integer
        description: e.g., /users/1234
    get:
      operationId: getUserPhotos
      summary: show the user's uploaded photos
      description: |
        obtain the list of photos for the specified user
      tags:
        - photos
      responses:
        "200":
          description: |
            An array of objects, each one containing information about one uploaded photo.
          content:
            application/json:
              schema:
                type: array
                description: list of photos to show as the user's uploaded photos
                items:
                  $ref: "#/components/schemas/photos-list"


  /users/{user-id}/photos/{photo-id}:
    parameters:
    - name: user-id
      in: path
      required: true
      description: this is the user id
      schema:
        type: integer
        description: e.g., /users/1234
    - name: photo-id
      in: path
      required: true
      description: this is the photo id
      schema:
        type: integer
        description: e.g., /photos/1234
    get:
      operationId: getPhotoInfo
      summary: obtain the photo's information
      description: |
        Return all the photo's information which includes when each photo was uploaded (date and time) and how many likes and comments it has.
      tags:
        - photos
      responses:
        "200":
          description: Request accepted, information obtained
          content:
            application/json:
              schema:
                type: array
                description: list of information of the photo
                items:
                  $ref: "#/components/schemas/photo-info"
    post:
      operationId: uploadPhoto
      summary: post a new photo
      description: |
        New photo is now present on the user's profile (at the top).
      tags:
        - photos
      requestBody:
        description: Photo to be uploaded
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
              description: image to upload
      responses:
        "200":
          description: new photo uploaded
          content:
            application/json:
              schema:
                type: integer
                description: photo correctly uploaded
    delete:
      operationId: deletePhoto
      summary: delete a photo 
      description: Remove a photo from the list of uploaded photos of the token bearer
      tags:
        - photos
      responses:
        "204": { description: image deleted successfully }
        "404": { description: image not found }


  /users/{user-id}/photos/{photo-id}/likes:
    parameters:
    - name: user-id
      in: path
      required: true
      description: this is the user id
      schema:
        type: integer
        description: e.g., /users/1234
    - name: photo-id
      in: path
      required: true
      description: this is the photo id
      schema:
        type: integer
        description: e.g., /photos/1234
    get:
      operationId: getLikesList
      summary: obtain the list of likes
      description: |
        Return the list of all the users that liked this photo
      tags:
        - photos
      responses:
        "200":
          description: Request accepted, likes listed in content
          content:
            application/json:
              schema:
                type: array
                description: list of users that liked this picture
                items:
                  $ref: "#/components/schemas/likes-list"
    post:
      operationId: likePhoto
      summary: place a like
      description: |
        place a like on the current photo by the token bearer
      tags:
        - photos
      responses:
        "200":
          description: like placed
          content:
            application/json:
              schema:
                type: integer
                description: liked put successfully
    delete:
      operationId: unlikePhoto
      summary: remove the like 
      description: remove the like from the current photo by the token bearer
      tags:
        - photos
      responses:
        "204": { description: like removed successfully }
        "404": 
          description: |
            like not found, meaning it was never put on this picture by this user


  /users/{user-id}/photos/{photo-id}/comments:
    parameters:
    - name: user-id
      in: path
      required: true
      description: this is the user id
      schema:
        type: integer
        description: e.g., /users/1234
    - name: photo-id
      in: path
      required: true
      description: this is the photo id
      schema:
        type: integer
        description: e.g., /photos/1234
    get:
      operationId: getCommentsList
      summary: obtain list of comments 
      description: |
        Return all comments that are placed on this photo by all users
      tags:
        - photos
      responses:
        "200":
          description: Request accepted, all comments listed in content
          content:
            application/json:
              schema:
                type: array
                description: list of comments under this picture
                items:
                  $ref: "#/components/schemas/comments-list"
    post:
      operationId: commentPhoto
      summary: post a new comment 
      description: |
        create a new comment for this photo from the token bearer
      tags:
        - photos
      responses:
        "200":
          description: new comment created
          content:
            application/json:
              schema:
                type: integer
                description: comment successfully posted
    delete:
      operationId: uncommentPhoto
      summary: delete a comment
      description: Remove the comment placed by the token bearer on this photo
      tags:
        - photos
      responses:
        "204": { description: comment deleted successfully }
        "404":
          description: |
            comment not found, meaning it was never put on this picture by this user

  
  /users/{user-id}/profile:
    parameters:
    - name: user-id
      in: path
      required: true
      description: this is the user id
      schema:
        type: integer
        description: e.g., /users/1234
    get:
      operationId: getUserProfile
      summary: obtain the profile information for specified user
      description: |
        Show the user's photos (in reverse chronological order), 
        how many photos have been uploaded, and the user's followers and following.
      tags:
        - profile
      responses:
        "200":
          description: |
            An array of objects, each one containing information about this 
            user's profile
          content:
            application/json:
              schema:
                type: array
                description: list of profile information
                items:
                  $ref: "#/components/schemas/profile-info"

  /users/{user-id}/profile/picture:
    parameters:
    - name: user-id
      in: path
      required: true
      description: this is the user id
      schema:
        type: integer
        description: e.g., /users/1234
    put:
      operationId: uploadProfilePic
      summary: Upload a profile picture
      requestBody:
        description: Photo to be uploaded as the profile picture (not mandatory)
        content:
          image/png:
            schema:
              type: string
              format: binary
              description: picture to be uploaded
      description: |
        Image to be uploaded as the profile picture
      tags:
        - profile
      responses:
        "200":
          description: profile photo updated
          content:
            application/json:
              schema:
                type: integer
                description: profile photo successfully updated
        "201":
          description: profile photo added
          content:
            application/json:
              schema:
                type: integer
                description: profile photo successfully added


  /users/{user-id}/following:
    parameters:
    - name: user-id
      in: path
      required: true
      description: this is the user id
      schema:
        type: integer
        description: e.g., /users/1234
    post:
      operationId: followUser
      summary: follow a new user
      description: |
        the token bearer now follows the specified user 
      tags:
        - profile
      responses:
        "200":
          description: new following user added
          content:
            application/json:
              schema:
                type: integer
                description: user successfully followed
    get:
      operationId: getFollowing
      summary: list all followed users
      description: |
        Obtain the list of all followed users
      tags:
        - profile
      responses:
        "200":
          description: |
            list of followed users shown
          content:
            application/json:
              schema:
                type: array
                description: list of users followed
                items:
                  $ref: "#/components/schemas/following-list"
    delete:
      operationId: unfollowUser
      summary: unfollow a user
      description: Remove the specified user from the following list of the token bearer
      tags:
        - profile
      responses:
        "204": { description: user removed from following list}
        "404": { description: user not found in following list}

  
  /users/{user-id}/followers:
    parameters:
    - name: user-id
      in: path
      required: true
      description: this is the user id
      schema:
        type: integer
        description: e.g., /users/1234
    get:
      operationId: getFollowers
      summary: list all followers for the specified user
      description: |
        Obtain the list of all users that follow the token bearer
      tags:
        - profile
      responses:
        "200":
          description: |
            A list of followers of the token bearer
          content:
            application/json:
              schema:
                type: array
                description: list of users that follow the token bearer
                items:
                  $ref: "#/components/schemas/followers-list"
    delete:
      operationId: removeFollower
      summary: remove a user from followers list
      description: |
        Remove the specified user from the followers list of the token bearer, so that 
        that user is not following the token bearer anymore
      tags:
        - profile
      responses:
        "204": { description: user removed from followers list}
        "404": { description: user not found in followers list}


  /users/{user-id}/banned:
    parameters:
    - name: user-id
      in: path
      required: true
      description: this is the user id
      schema:
        type: integer
        description: e.g., /users/1234
    get:
      operationId: getBannedList
      summary: list all banned users
      description: |
        Obtain the list of all the users that were banned by the token bearer.
      tags:
        - users
      responses:
        "200":
          description: |
            An object containing all of the users banned by the token bearer
          content:
            application/json:
              schema:
                type: array
                description: list of banned users
                items:
                  $ref: "#/components/schemas/banned-users"
    post:
      operationId: banUser
      summary: ban a new user
      description: |
        Ban the indicated user, so that they are not able to see anything on
        the token bearer's profile aside from the username.
      tags:
        - users
      responses:
        "200":
          description: banned a user
          content:
            application/json:
              schema:
                type: integer
                description: user successfully banned
    delete:
      operationId: unbanUser
      summary: unban a user
      description: unban a previously-and-until-now-currently banned user
      tags:
        - users
      responses:
        "204": { description: user unbanned successfully}
        "404": { description: user not found among the banned users}  

                  
  /session:
    post:
      tags: ["login"]
      summary: Logs in the user
      description: |-
        If the user does not exist, it will be created,
        and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      requestBody:
        description: User details
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Maria
                  pattern: "^.*?$"
                  minLength: 3
                  maxLength: 16
        required: true
      responses:
        '201':
          description: User log-in action successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    # change here if you decide to use an integer
                    # or any other type of identifier
                    type: string
                    example: "abcdef012345"
                    pattern: "^.*?$"

components:
  schemas:
    profile-info:
      type: object
      properties:
        username:
          type: string
          description: username of the user's profile

        photos:
          type: array
          description: uploaded photos
          items:
            $ref: "#/components/schemas/photo-info"

        num-photos:
          type: integer
          description: number of uploaded photos
        
        followers:
          type: array
          description: followers list
          items:
            $ref: "#/components/schemas/followers-list"
        
        following:
          type: array
          description: following list
          items:
            $ref: "#/components/schemas/following-list"

    photo-info:
      type: object
      properties:
        photo-id:
          type: integer
          description: photo id

        creator:
          type: string
          description: username of the poster of the photo

        date-time: 
          type: string
          format: date-time
          description: upload date and time of the photo

        num-likes:
          type: integer
          description: number of likes on the photo
        
        num-comments:
          type: integer
          description: number of comments on the photo

    user-info:
      type: object
      properties:
        user-id:
          type: integer
          description: user id

        username:
          type: string
          description: username of the user's profile
        
        profile-pic:
          type: string
          description: URL of profile picture of this user

    feed-info:
      type: object
      properties:
        photos:
          type: array
          description: photos from followed users
          items:
            $ref: "#/components/schemas/photo-info"

    photos-list:
      type: object
      properties:
        photos:
          type: array
          description: uploaded photos from the specified user
          items:
            $ref: "#/components/schemas/photo-info"

    likes-list:
      type: object
      properties:
        photo-id:
          type: integer
          description: id of the photo that's being liked

        users:
          type: array
          description: users that liked this picture
          items:
            $ref: "#/components/schemas/user-info"

    comments-list:
      type: object
      properties:
        photo-id:
          type: integer
          description: id of the photo that's being commented on

        comments:
          type: array
          description: comments posted on the picture and their info 
          items:
            $ref: "#/components/schemas/comments-info"
    
    comments-info:
      type: object
      properties:
        poster:
          type: string
          description: username of the person that commented this string on the picture

        comment:
          type: string
          description: comment posted on the picture
        
        date-time: 
          type: string
          format: date-time
          description: date and time of when the comment was posted

    following-list:
      type: object
      properties:
        users:
          type: array
          description: users that the token bearer is following
          items:
            $ref: "#/components/schemas/user-info"

    followers-list:
      type: object
      properties:
        users:
          type: array
          description: list of users that follow the token bearer
          items:
            $ref: "#/components/schemas/user-info"

    banned-users:
      type: object
      properties:
        users:
          type: array
          description: list of users the token bearer banned 
          items:
            $ref: "#/components/schemas/user-info"


  securitySchemes:
    BearerAuthorization:         
      type: http
      scheme: bearer
      bearerFormat: JWT 
  responses:
    UnauthorizedError:
      description: Access token is missing or invalid
security: # Apply the security globally to all operations
  - BearerAuthorization: []      
